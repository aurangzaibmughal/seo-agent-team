name: CI Pipeline

on:
  push:
    branches: [ main, "fix/**", "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history and files for secrets
        run: |
          echo "Scanning for API keys, private keys, and connection strings..."
          SECRET_FOUND=0
          
          # Check for private keys
          if git grep -I -E "BEGIN (RSA|OPENSSH|EC|DSA|PGP|PRIVATE) KEY" -- . ":!.github" ; then
            echo "::error::Private key pattern detected in repository!"
            SECRET_FOUND=1
          fi

          # Check for Anthropic API keys (sk-ant-)
          if git grep -I -E "sk-ant-[a-zA-Z0-9_-]{20,}" -- . ":!.github" ; then
            echo "::error::Anthropic API key pattern detected in repository!"
            SECRET_FOUND=1
          fi

          # Check for OpenAI API keys (sk-proj- or standard sk-)
          if git grep -I -E "sk-(proj-)?[a-zA-Z0-9_-]{24,}" -- . ":!.github" ":!backend/tests" ; then
            echo "::error::OpenAI API key pattern detected in repository!"
            SECRET_FOUND=1
          fi

          # Check for Database connection strings with credentials
          if git grep -I -E "(postgres|postgresql|mysql|mongodb|redis)://[a-zA-Z0-9_]+:[^@]+@" -- . ":!.github" ":!backend/tests" ; then
            echo "::error::Hardcoded database connection credentials detected!"
            SECRET_FOUND=1
          fi

          if [ $SECRET_FOUND -ne 0 ]; then
            echo "Secret scan failed! Please remove sensitive credentials."
            exit 1
          fi
          echo "Secret scan passed cleanly. No secrets found."

  backend-quality:
    name: Backend Quality (Ruff, Mypy, Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-asyncio

      - name: Ruff Linter Check
        run: ruff check app tests

      - name: Mypy Type Check
        run: mypy app

      - name: Pytest Suite
        run: pytest -q

  frontend-quality:
    name: Frontend Quality (ESLint, TypeScript, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Production Build
        run: npm run build
